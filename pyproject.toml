[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nkk-codemind"
version = "0.1.0"
description = "Lightweight knowledge-driven AI software development engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "License not selected yet; see repository status." }
authors = [{ name = "NKK CodeMind contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
codemind = "codemind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"